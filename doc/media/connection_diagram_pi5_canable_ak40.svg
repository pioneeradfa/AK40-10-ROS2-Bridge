<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#222">Raspberry Pi 5 + MKS CANable V2.0 Pro + CubeMars AK40-10 — CAN connection diagram (1 Mbit/s)</text>
  <text x="20" y="50" font-size="11.5" fill="#666">Stock CANable firmware = slcan (/dev/ttyACM0 → slcand → slcan0). After candleLight DFU flash the same wiring gives native can0 (gs_usb).</text>

  <!-- ================= Raspberry Pi 5 ================= -->
  <rect x="30" y="120" width="200" height="170" rx="8" fill="#f5f7fa" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="150" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Raspberry Pi 5</text>
  <text x="130" y="172" font-size="11" text-anchor="middle" fill="#444">Ubuntu 24.04 (Jazzy) or</text>
  <text x="130" y="187" font-size="11" text-anchor="middle" fill="#444">Pi OS Bookworm (Humble)</text>
  <text x="130" y="206" font-size="11" text-anchor="middle" fill="#444">ak_motor_driver (ROS 2)</text>
  <text x="130" y="268" font-size="10.5" font-style="italic" text-anchor="middle" fill="#555">GPIO GND = header pin 6</text>
  <!-- USB port stub -->
  <rect x="222" y="162" width="8" height="16" fill="#7f8c8d"/>
  <text x="218" y="158" font-size="10" text-anchor="end" fill="#555">USB-A port</text>
  <!-- GND bottom stub -->
  <rect x="126" y="286" width="8" height="6" fill="#16a085"/>

  <!-- ================= MKS CANable V2.0 Pro ================= -->
  <rect x="330" y="120" width="230" height="170" rx="8" fill="#eef6ee" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="148" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">MKS CANable V2.0 Pro</text>
  <text x="445" y="166" font-size="11" text-anchor="middle" fill="#444">isolated USB→CAN (ADM3050)</text>
  <text x="445" y="182" font-size="11" text-anchor="middle" fill="#444">stock fw: slcan → /dev/ttyACM0</text>
  <text x="445" y="197" font-size="10.5" font-style="italic" text-anchor="middle" fill="#666">(candleLight flash → native can0)</text>
  <text x="400" y="222" font-size="11" font-weight="bold" fill="#c0392b">120 Ω DIP switch: ON</text>
  <rect x="512" y="212" width="26" height="12" rx="2" fill="#ddd" stroke="#c0392b"/>
  <rect x="526" y="214" width="10" height="8" fill="#c0392b"/>
  <text x="445" y="246" font-size="10" text-anchor="middle" fill="#777">= bus termination #1</text>
  <!-- USB stub left -->
  <rect x="322" y="162" width="8" height="16" fill="#7f8c8d"/>
  <!-- CAN terminal stubs right -->
  <rect x="556" y="144" width="8" height="12" fill="#e67e22"/>
  <rect x="556" y="179" width="8" height="12" fill="#2980b9"/>
  <text x="552" y="154" font-size="11" font-weight="bold" text-anchor="end" fill="#e67e22">CANH</text>
  <text x="552" y="189" font-size="11" font-weight="bold" text-anchor="end" fill="#2980b9">CANL</text>
  <!-- GND bottom stub -->
  <rect x="446" y="286" width="8" height="6" fill="#16a085"/>
  <text x="445" y="280" font-size="10.5" text-anchor="middle" fill="#16a085">GND (CAN side)</text>

  <!-- ================= AK40-10 driver board ================= -->
  <rect x="680" y="90" width="230" height="210" rx="8" fill="#fdf3ec" stroke="#333" stroke-width="1.5"/>
  <text x="795" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">CubeMars AK40-10</text>
  <text x="795" y="128" font-size="11" text-anchor="middle" fill="#444">driver board (AK40-2410-1A-A1)</text>
  <!-- CAN connector stubs -->
  <rect x="672" y="114" width="8" height="12" fill="#2980b9"/>
  <rect x="672" y="144" width="8" height="12" fill="#e67e22"/>
  <text x="692" y="124" font-size="10.5" fill="#2980b9">CAN 4-pin GH1.25  pin 1 = CAN_L</text>
  <text x="692" y="154" font-size="10.5" fill="#e67e22">pin 2 = CAN_H</text>
  <text x="692" y="171" font-size="10" fill="#888">pins 3 (H) / 4 (L) = daisy-chain — open</text>
  <!-- XT30 stubs -->
  <rect x="672" y="244" width="8" height="12" fill="#c0392b"/>
  <rect x="672" y="264" width="8" height="12" fill="#222"/>
  <text x="692" y="254" font-size="10.5" fill="#c0392b">XT30 pin 2 = +24 V</text>
  <text x="692" y="274" font-size="10.5" fill="#222">XT30 pin 1 = − (PSU V−)</text>
  <text x="795" y="210" font-size="10.5" font-style="italic" text-anchor="middle" fill="#555">add 120 Ω across CAN_H–CAN_L</text>
  <text x="795" y="224" font-size="10.5" font-style="italic" text-anchor="middle" fill="#555">at this end = termination #2</text>

  <!-- ================= 24 V PSU ================= -->
  <rect x="680" y="380" width="230" height="110" rx="8" fill="#eef0f7" stroke="#333" stroke-width="1.5"/>
  <text x="795" y="408" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">24 V DC power supply</text>
  <text x="795" y="426" font-size="10.5" text-anchor="middle" fill="#444">AK40-10 rated 24 V — size current for load</text>
  <text x="795" y="442" font-size="10.5" text-anchor="middle" fill="#444">NEVER power the motor from the Pi</text>
  <rect x="672" y="404" width="8" height="12" fill="#c0392b"/>
  <rect x="672" y="464" width="8" height="12" fill="#222"/>
  <text x="692" y="414" font-size="10.5" fill="#c0392b">V+ → motor XT30 +</text>
  <text x="692" y="474" font-size="10.5" fill="#222">V− → star ground point</text>

  <!-- ================= wires ================= -->
  <!-- USB -->
  <line x1="230" y1="170" x2="330" y2="170" stroke="#7f8c8d" stroke-width="3.5"/>
  <text x="280" y="162" font-size="10.5" text-anchor="middle" fill="#555">USB cable</text>
  <!-- CAN_H -->
  <line x1="560" y1="150" x2="680" y2="150" stroke="#e67e22" stroke-width="2.5"/>
  <text x="620" y="141" font-size="10.5" text-anchor="middle" fill="#e67e22">CAN_H (twisted pair)</text>
  <!-- CAN_L -->
  <polyline points="560,185 640,185 640,120 680,120" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <text x="600" y="199" font-size="10.5" text-anchor="middle" fill="#2980b9">CAN_L</text>
  <!-- termination resistor #2 -->
  <line x1="661" y1="120" x2="661" y2="126" stroke="#333" stroke-width="1.5"/>
  <rect x="656" y="126" width="10" height="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="661" y1="144" x2="661" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="652" y="110" font-size="10" text-anchor="end" fill="#333">120 Ω</text>
  <!-- 24 V+ -->
  <polyline points="680,410 664,410 664,250 680,250" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="658" y="330" font-size="10.5" text-anchor="end" fill="#c0392b">24 V+</text>
  <!-- 24 V− -->
  <polyline points="680,470 648,470 648,270 680,270" fill="none" stroke="#222" stroke-width="3.5"/>
  <text x="642" y="350" font-size="10.5" text-anchor="end" fill="#222">24 V−</text>
  <!-- grounds (teal dashed) -->
  <polyline points="450,290 450,545 672,545 672,470 680,470" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="130,290 130,545 450,545" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="450" cy="545" r="3.5" fill="#16a085"/>
  <circle cx="672" cy="470" r="3.5" fill="#16a085"/>
  <text x="458" y="430" font-size="10.5" fill="#16a085">CAN-side GND</text>
  <text x="138" y="430" font-size="10.5" fill="#16a085">Pi GPIO GND (pin 6)</text>
  <text x="500" y="560" font-size="10.5" text-anchor="middle" fill="#16a085">common ground — star point at PSU V−</text>

  <!-- ================= legend ================= -->
  <rect x="30" y="575" width="440" height="58" rx="6" fill="#fafafa" stroke="#bbb"/>
  <text x="42" y="593" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <line x1="95" y1="589" x2="125" y2="589" stroke="#7f8c8d" stroke-width="3.5"/><text x="130" y="593" font-size="10" fill="#444">USB</text>
  <line x1="165" y1="589" x2="195" y2="589" stroke="#e67e22" stroke-width="2.5"/><text x="200" y="593" font-size="10" fill="#444">CAN_H</text>
  <line x1="245" y1="589" x2="275" y2="589" stroke="#2980b9" stroke-width="2.5"/><text x="280" y="593" font-size="10" fill="#444">CAN_L</text>
  <line x1="325" y1="589" x2="355" y2="589" stroke="#c0392b" stroke-width="3.5"/><text x="360" y="593" font-size="10" fill="#444">24 V+</text>
  <line x1="405" y1="589" x2="435" y2="589" stroke="#222" stroke-width="3.5"/><text x="440" y="593" font-size="10" fill="#444">24 V−</text>
  <line x1="95" y1="615" x2="125" y2="615" stroke="#16a085" stroke-width="2" stroke-dasharray="6 4"/><text x="130" y="619" font-size="10" fill="#444">ground / reference</text>
  <rect x="245" y="608" width="10" height="14" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="262" y="619" font-size="10" fill="#444">120 Ω termination (2× total, both bus ends)</text>

  <!-- ================= notes ================= -->
  <rect x="490" y="575" width="480" height="58" rx="6" fill="#fff8e6" stroke="#e0c060"/>
  <text x="502" y="592" font-size="10.5" fill="#6b5200">• DIP switch ON = termination #1 · add 120 Ω at motor end = #2 (exactly two on the bus)</text>
  <text x="502" y="607" font-size="10.5" fill="#6b5200">• Power the motor BEFORE launching the node / sending frames; disable before shutdown</text>
  <text x="502" y="622" font-size="10.5" fill="#6b5200">• slcan fw: sudo slcand -o -c -f -s8 /dev/ttyACM0 slcan0 → launch can_interface:=slcan0</text>
</svg>
